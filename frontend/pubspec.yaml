name: shiksha_saathi
description: AI-powered teacher assistant for rural India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # DI
  get_it: ^9.2.1
  injectable: ^2.4.2

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # UI
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^2.0.1

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^13.2.1
  url_launcher: ^6.2.5
  package_info_plus: ^10.2.1

  # Icons
  flutter_svg: ^2.0.10+1
  iconly: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  retrofit_generator: ^8.1.0
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_Condensed-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari_Condensed-Bold.ttf
          weight: 700
